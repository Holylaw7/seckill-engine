name: Seckill-Engine CI

on:
  push:
    branches: [ main, develop, "feature/**" ]
  pull_request:
    branches: [ main, develop ]

permissions:
  contents: read

jobs:
  build:
    name: Stage 1 Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Compile
        run: mvn -B clean compile -DskipTests

  unit-test:
    name: Stage 2 Unit Test
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Run unit + default integration suite
        run: mvn -B test
      - name: Upload surefire reports
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports-unit
          path: "**/target/surefire-reports"
          if-no-files-found: error

  dependency-scan:
    name: Stage 2b Dependency Vulnerability Scan
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Run OWASP Dependency Check
        # Phase 6.6.3 Release 安全门禁：CVSS >= 7 判定 FAIL，阻塞 release-gate
        run: mvn -B org.owasp:dependency-check-maven:10.0.4:check -DfailBuildOnCVSS=7 -Dformat=JSON,HTML -DprettyPrint=true
      - name: Collect dependency reports for release audit
        # Phase 6.7 Task 7：dependency-report.html 归档至 docs/06-production/security/
        run: |
          mkdir -p docs/06-production/security
          find . -path '*/target/dependency-check-report.html' -exec cp -f {} docs/06-production/security/dependency-report.html \; 2>/dev/null || true
          find . -path '*/target/dependency-check-report.json' -exec cp -f {} docs/06-production/security/dependency-report.json \; 2>/dev/null || true
      - name: Upload dependency scan reports
        uses: actions/upload-artifact@v4
        with:
          name: dependency-scan-report
          path: "**/target/dependency-check-report.*"
          if-no-files-found: error
      - name: Upload release security audit folder
        uses: actions/upload-artifact@v4
        with:
          name: release-security-audit
          path: docs/06-production/security
          if-no-files-found: error

  integration-test:
    name: Stage 3 Integration Test (30 ITs)
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Run integration + chaos drills (Testcontainers)
        run: mvn -B -pl integration-test -am test "-Dchaos.excluded="
      - name: Upload surefire reports
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports-integration
          path: "**/target/surefire-reports"
          if-no-files-found: error

  quality-check:
    name: Stage 4 Quality Check (Coverage)
    runs-on: ubuntu-latest
    needs: [ unit-test, integration-test ]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Restore test artifacts
        uses: actions/download-artifact@v4
        with:
          name: surefire-reports-integration
          path: reports
      - name: Generate JaCoCo reports
        run: mvn -B jacoco:report
      - name: Upload JaCoCo report
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: "**/target/site/jacoco"
          if-no-files-found: error

  release-gate:
    name: Stage 5 Release Gate
    runs-on: ubuntu-latest
    needs: [quality-check, dependency-scan]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Run release check
        run: bash scripts/release-check.sh
      - name: Upload release report
        uses: actions/upload-artifact@v4
        with:
          name: release-check-report
          path: docs/04-测试体系/release-check-report.md
          if-no-files-found: error
