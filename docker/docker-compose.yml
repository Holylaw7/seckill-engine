name: seckill-engine

# 演示部署（Phase 6.24）：全链路一键启动
# 用法：docker compose -f docker/docker-compose.yml up -d --build
# 访问：Gateway http://localhost:8080
# 注意：root 密码与内部密钥为演示值，生产必须替换（见 operations-runbook.md）

services:
  mysql:
    image: mysql:8.0.36
    container_name: seckill-mysql-compose
    environment:
      MYSQL_ROOT_PASSWORD: seckill-root
      TZ: Asia/Shanghai
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_0900_ai_ci
    ports:
      - "3306:3306"
    volumes:
      - ../sql/auth-service/V1.0__init.sql:/docker-entrypoint-initdb.d/10-auth.sql:ro
      - ../sql/seckill-service/V1.0__init.sql:/docker-entrypoint-initdb.d/20-seckill.sql:ro
      - ../sql/inventory-service/V1.0__init.sql:/docker-entrypoint-initdb.d/30-inventory.sql:ro
      - ../sql/inventory-service/V2__inventory_bucket.sql:/docker-entrypoint-initdb.d/31-inventory-bucket.sql:ro
      - ../sql/inventory-service/V3__stock_flow_bucket.sql:/docker-entrypoint-initdb.d/32-stock-flow-bucket.sql:ro
      - ../sql/order-service/V1.0__init.sql:/docker-entrypoint-initdb.d/40-order.sql:ro
      - ../sql/payment-service/V1.0__init.sql:/docker-entrypoint-initdb.d/50-payment.sql:ro
      - ../sql/test-data/seckill-test.sql:/docker-entrypoint-initdb.d/90-seckill-test.sql:ro
      - ../sql/test-data/inventory-test.sql:/docker-entrypoint-initdb.d/91-inventory-test.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-proot"]
      interval: 10s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7.2.4-alpine
    container_name: seckill-redis-compose
    ports:
      - "6379:6379"

  rocketmq-namesrv:
    image: apache/rocketmq:5.3.1
    container_name: seckill-rmq-namesrv-compose
    command: sh mqnamesrv
    ports:
      - "9876:9876"

  rocketmq-broker:
    image: apache/rocketmq:5.3.1
    container_name: seckill-rmq-broker-compose
    depends_on:
      - rocketmq-namesrv
    environment:
      JAVA_OPT_EXT: "-Xms512m -Xmx1g -XX:+UseG1GC"
    volumes:
      - ./broker.conf:/home/rocketmq/broker.conf:ro
    command: sh mqbroker -n rocketmq-namesrv:9876 -c /home/rocketmq/broker.conf
    ports:
      - "10911:10911"
      - "10909:10909"

  gateway:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      args:
        MODULE: gateway
    image: seckill/gateway:rc1
    container_name: seckill-gateway-compose
    depends_on: [auth, seckill, order, inventory, payment, redis]
    ports:
      - "8080:8080"
    command:
      - "--seckill.gateway.jwt.secret=seckill-engine-dev-secret-change-me"
      - "--spring.data.redis.host=redis"
      - "--spring.data.redis.port=6379"
      - "--seckill.gateway.canary.enabled=true"
      - "--seckill.gateway.canary.weight=5"
      - "--seckill.gateway.canary.version=RC1"
      - "--seckill.gateway.canary.control-enabled=true"
      - "--seckill.gateway.canary.control-token=dev-canary-token"
      - "--spring.cloud.gateway.routes[0].id=auth-service"
      - "--spring.cloud.gateway.routes[0].uri=http://auth:8081"
      - "--spring.cloud.gateway.routes[0].predicates[0]=Path=/api/v1/auth/**"
      - "--spring.cloud.gateway.routes[1].id=seckill-service"
      - "--spring.cloud.gateway.routes[1].uri=http://seckill:8082"
      - "--spring.cloud.gateway.routes[1].predicates[0]=Path=/api/v1/seckill/**"
      - "--spring.cloud.gateway.routes[2].id=order-service"
      - "--spring.cloud.gateway.routes[2].uri=http://order:8083"
      - "--spring.cloud.gateway.routes[2].predicates[0]=Path=/api/v1/orders/**"
      - "--spring.cloud.gateway.routes[3].id=payment-service"
      - "--spring.cloud.gateway.routes[3].uri=http://payment:8084"
      - "--spring.cloud.gateway.routes[3].predicates[0]=Path=/api/v1/payments/**"

  auth:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      args:
        MODULE: auth-service
    image: seckill/auth:rc1
    container_name: seckill-auth-compose
    depends_on: [mysql, redis]
    command:
      - "--spring.datasource.url=jdbc:mysql://mysql:3306/seckill_auth?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai"
      - "--spring.datasource.username=root"
      - "--spring.datasource.password=seckill-root"
      - "--spring.data.redis.host=redis"
      - "--spring.data.redis.port=6379"
      - "--seckill.auth.jwt.secret=seckill-engine-dev-secret-change-me"

  seckill:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      args:
        MODULE: seckill-service
    image: seckill/seckill:rc1
    container_name: seckill-seckill-compose
    depends_on: [mysql, redis, rocketmq-namesrv, rocketmq-broker, auth]
    command:
      - "--spring.datasource.url=jdbc:mysql://mysql:3306/seckill_seckill?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai"
      - "--spring.datasource.username=root"
      - "--spring.datasource.password=seckill-root"
      - "--spring.data.redis.host=redis"
      - "--spring.data.redis.port=6379"
      - "--rocketmq.name-server=rocketmq-namesrv:9876"
      - "--seckill.core.risk-check.enabled=false"
      - "--seckill.core.risk-check.base-url=http://auth:8081"
      - "--inventory.sharding.enabled=true"
      - "--inventory.sharding.bucket-count=8"
      - "--seckill.internal-auth.enabled=true"
      - "--seckill.internal-auth.clients.order-service=dev-order-secret"
      - "--seckill.internal-auth.clients.inventory-service=dev-inventory-secret"
      - "--seckill.internal-auth.admin-secret=dev-admin-secret"

  inventory:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      args:
        MODULE: inventory-service
    image: seckill/inventory:rc1
    container_name: seckill-inventory-compose
    depends_on: [mysql, redis, rocketmq-namesrv, rocketmq-broker, seckill]
    command:
      - "--spring.datasource.url=jdbc:mysql://mysql:3306/seckill_inventory?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai"
      - "--spring.datasource.username=root"
      - "--spring.datasource.password=seckill-root"
      - "--spring.data.redis.host=redis"
      - "--spring.data.redis.port=6379"
      - "--rocketmq.name-server=rocketmq-namesrv:9876"
      - "--inventory.sharding.enabled=true"
      - "--inventory.sharding.bucket-count=8"
      - "--seckill.inventory.recover.base-url=http://seckill:8082"
      - "--seckill.internal-auth.enabled=true"
      - "--seckill.internal-auth.clients.inventory-service=dev-inventory-secret"
      - "--seckill.internal-auth.admin-secret=dev-admin-secret"

  order:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      args:
        MODULE: order-service
    image: seckill/order:rc1
    container_name: seckill-order-compose
    depends_on: [mysql, rocketmq-namesrv, rocketmq-broker, seckill]
    command:
      - "--spring.datasource.url=jdbc:mysql://mysql:3306/seckill_order?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai"
      - "--spring.datasource.username=root"
      - "--spring.datasource.password=seckill-root"
      - "--rocketmq.name-server=rocketmq-namesrv:9876"
      - "--seckill.order.pre-deduct-confirm.base-url=http://seckill:8082"
      - "--seckill.internal-auth.enabled=true"
      - "--seckill.internal-auth.clients.order-service=dev-order-secret"

  payment:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      args:
        MODULE: payment-service
    image: seckill/payment:rc1
    container_name: seckill-payment-compose
    depends_on: [mysql, rocketmq-namesrv, rocketmq-broker]
    command:
      - "--spring.datasource.url=jdbc:mysql://mysql:3306/seckill_payment?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai"
      - "--spring.datasource.username=root"
      - "--spring.datasource.password=seckill-root"
      - "--rocketmq.name-server=rocketmq-namesrv:9876"
