server:
  port: 8080
  netty:
    # Phase 6.3 容量调优：容量基准在 ≥1000 并发出现连接排队/超时（默认 8192 连接），
    # 提高接入连接上限并收紧建连超时（基于 GATEWAY_CAPACITY 数据）
    max-connections: 20000
    connection-timeout: 5000

spring:
  application:
    name: gateway
  cloud:
    gateway:
      httpclient:
        # 容量调优：默认固定池 500 连接，1000+ 并发出现 acquire 排队与超时
        pool:
          type: fixed
          max-connections: 2000
          max-pending-acquire: 10000
          acquire-timeout: 10000
        connect-timeout: 5000
        response-timeout: 30s
      routes:
        - id: auth-service
          uri: http://localhost:8081
          predicates:
            - Path=/api/v1/auth/**
        - id: seckill-service
          uri: http://localhost:8082
          predicates:
            - Path=/api/v1/seckill/**
          filters:
            - name: RequestRateLimiter
              args:
                key-resolver: '#{@rateLimitKeyResolver}'
                redis-rate-limiter.replenishRate: 100
                redis-rate-limiter.burstCapacity: 200
        - id: order-service
          uri: http://localhost:8083
          predicates:
            - Path=/api/v1/orders/**
        - id: payment-service
          uri: http://localhost:8084
          predicates:
            - Path=/api/v1/payments/**
  data:
    redis:
      host: localhost
      port: 6379
      # RC-02：显式命令超时，避免依赖挂起拖垮请求（fail-open 依赖该超时）
      timeout: 3s

seckill:
  gateway:
    jwt:
      enabled: true
      secret: seckill-engine-dev-secret-change-me
    canary:
      # Phase 6.7 Canary 灰度：默认关闭（weight=0 等价旧网关），上线按 5→25→50→100 由运维平台调整
      enabled: false
      weight: 0
      version: RC1
      control-enabled: false
      control-token: ""

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  metrics:
    tags:
      application: gateway

# 说明（冻结）：
# - 基础版路由使用静态 URI，生产环境 Phase 7 切换为 lb://服务名 + Nacos 服务发现；
# - 限流参数为基础值，Phase 5 压测后经 Nacos 动态校准；
# - 黑名单 key：risk:blacklist:ip:{ip} / risk:blacklist:user:{userId}（对齐 Redis 设计）。
