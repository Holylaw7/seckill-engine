server:
  port: 8085

spring:
  application:
    name: inventory-service
  datasource:
    url: jdbc:mysql://localhost:3306/seckill_inventory?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
    username: inventory_rw
    password: change-me
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 20
      connection-timeout: 5000
      validation-timeout: 3000
      leak-detection-threshold: 10000
  data:
    redis:
      host: localhost
      port: 6379
      # RC-02：分桶对账读取 Redis 需要显式超时
      timeout: 3s

rocketmq:
  name-server: localhost:9876
  producer:
    group: inventory-producer

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

seckill:
  internal-auth:
    # Phase 6.6 内部接口 Service ACL（生产由配置中心下发）
    client-name: inventory-service
    client-secret: dev-inventory-secret
    clients:
      inventory-service: dev-inventory-secret
    admin-secret: dev-admin-secret
  mq:
    consumer:
      # Phase 6.1 调优：8 消费线程（基线 20；单 SKU 行锁场景 4/8/20 持平，8 最优且线程开销最小）
      threads: 8
  inventory:
    worker-id: 3
    recover:
      # seckill-service 内部回补接口（契约冻结：requestId=stock_flow.flow_no，幂等）
      base-url: http://localhost:8082
      path: /api/v1/seckill/internal/stocks/recover

# Phase 6.2 库存分桶（默认关闭且桶数=1，行为等价旧系统）
inventory:
  sharding:
    enabled: false
    bucket-count: 1

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  metrics:
    tags:
      application: inventory-service
