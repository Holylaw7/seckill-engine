server:
  port: 8083

spring:
  application:
    name: order-service
  datasource:
    url: jdbc:mysql://localhost:3306/seckill_order?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
    username: order_rw
    password: change-me
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 20
      connection-timeout: 5000
      validation-timeout: 3000
      leak-detection-threshold: 10000

rocketmq:
  name-server: localhost:9876
  producer:
    group: order-producer
    send-message-timeout: 3000

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

seckill:
  mq:
    consumer:
      # Phase 6.1 调优：16 消费线程（基线 20；实测 order 链路 269 QPS）
      threads: 16
  order:
    worker-id: 4
    pay-deadline-minutes: 15
    timeout-close:
      period-seconds: 30
      batch-size: 200
    cancel-notify-compensate-period-seconds: 60
    pre-deduct-confirm:
      # seckill-service 内部确认接口（已实现）
      base-url: http://localhost:8082
      path: /api/v1/seckill/internal/pre-deducts/confirm
